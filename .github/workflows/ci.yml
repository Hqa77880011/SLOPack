name: Package checks

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m compileall -q src
      - run: slopack --help
      - run: slopack run --help
      - run: slopack experiment --help
      - run: slopack report --help
      - run: python -c "import slopack.reporting, slopack.plotting"
